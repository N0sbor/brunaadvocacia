<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#28221E"/>
      <stop offset="100%" style="stop-color:#3a2f28"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5C534A;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#3a2f28;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <!-- Fundo -->
  <rect width="480" height="560" fill="url(#bg)" rx="16"/>
  <!-- Borda decorativa -->
  <rect x="1" y="1" width="478" height="558" fill="none" stroke="#B87551" stroke-width="2" rx="15" opacity="0.4"/>
  <!-- Silhueta feminina estilizada -->
  <!-- Cabeça -->
  <ellipse cx="240" cy="155" rx="70" ry="75" fill="url(#silhouette)"/>
  <!-- Pescoço -->
  <rect x="218" y="220" width="44" height="35" fill="url(#silhouette)" rx="4"/>
  <!-- Ombros / corpo -->
  <path d="M80 380 Q120 240 185 252 L240 258 L295 252 Q360 240 400 380 L420 560 L60 560 Z" fill="url(#silhouette)"/>
  <!-- Textura de terno (linhas sutis) -->
  <line x1="200" y1="300" x2="180" y2="500" stroke="#B87551" stroke-width="0.5" opacity="0.15"/>
  <line x1="240" y1="260" x2="240" y2="520" stroke="#B87551" stroke-width="0.5" opacity="0.15"/>
  <line x1="280" y1="300" x2="300" y2="500" stroke="#B87551" stroke-width="0.5" opacity="0.15"/>
  <!-- Label -->
  <rect x="80" y="490" width="320" height="50" fill="#B87551" opacity="0.15" rx="8"/>
  <text x="240" y="512" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#D9A57C" font-weight="700" letter-spacing="1">Dra. Bruna Beloti</text>
  <text x="240" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#F7F1E8" opacity="0.6" letter-spacing="2">SUBSTITUIR PELA FOTO REAL</text>
  <!-- Canto decorativo -->
  <path d="M16 16 L50 16 L16 50 Z" fill="#B87551" opacity="0.3"/>
  <path d="M464 544 L430 544 L464 510 Z" fill="#B87551" opacity="0.3"/>
</svg>
