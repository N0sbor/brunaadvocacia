<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72">
  <defs>
    <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D9A57C"/>
      <stop offset="45%"  stop-color="#B87551"/>
      <stop offset="100%" stop-color="#8C4F31"/>
    </linearGradient>
  </defs>

  <!-- ── QUADRADO EXTERNO ── -->
  <rect x="2" y="4" width="64" height="64" rx="3" ry="3"
        fill="none" stroke="url(#copper)" stroke-width="2.5"/>

  <!-- ── LETRA B ── -->
  <!-- Coluna vertical do B -->
  <rect x="14" y="14" width="5" height="44" rx="1.5" fill="url(#copper)"/>
  <!-- Arco superior do B -->
  <path d="M19 14 L34 14 Q44 14 44 24 Q44 34 34 34 L19 34"
        fill="none" stroke="url(#copper)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arco inferior do B (ligeiramente maior) -->
  <path d="M19 34 L35 34 Q46 34 46 44.5 Q46 58 35 58 L19 58"
        fill="none" stroke="url(#copper)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── LETRA I (separador fino + traço) ── -->
  <rect x="52" y="14" width="4" height="44" rx="1.5" fill="url(#copper)" opacity="0.75"/>

  <!-- ── TEXTO: Beloti ── -->
  <text x="80" y="46"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="38"
        font-weight="700"
        fill="url(#copper)"
        letter-spacing="-0.5">Beloti</text>

  <!-- ── TEXTO: ADVOCACIA ── -->
  <text x="82" y="62"
        font-family="'Public Sans', Arial, sans-serif"
        font-size="11"
        font-weight="400"
        fill="url(#copper)"
        letter-spacing="4.5"
        opacity="0.85">ADVOCACIA</text>
</svg>
