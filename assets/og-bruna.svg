<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1815"/>
      <stop offset="60%" style="stop-color:#28221E"/>
      <stop offset="100%" style="stop-color:#3a2f28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ogbg)"/>
  <!-- Borda -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#B87551" stroke-width="2" opacity="0.4" rx="12"/>
  <!-- Acento decorativo esquerdo -->
  <rect x="0" y="0" width="6" height="630" fill="#B87551"/>
  <!-- Monograma grande -->
  <text x="80" y="420" font-family="Georgia, serif" font-size="320" font-weight="700" fill="#B87551" opacity="0.08">B</text>
  <!-- Headline -->
  <text x="80" y="200" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#F7F1E8" letter-spacing="-0.5">Seu filho tem direito à vaga na creche.</text>
  <text x="80" y="272" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#D9A57C">A prefeitura pode ser obrigada a dar.</text>
  <!-- Separador -->
  <rect x="80" y="310" width="120" height="3" fill="#B87551" rx="2"/>
  <!-- Subheadline -->
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="22" fill="#F7F1E8" opacity="0.7">Mandado de segurança · Direito de Família · OAB/PR</text>
  <!-- Nome -->
  <text x="80" y="560" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#D9A57C" letter-spacing="1">Dra. Bruna Beloti</text>
  <text x="80" y="592" font-family="Arial, sans-serif" font-size="16" fill="#F7F1E8" opacity="0.5" letter-spacing="3">BELOTI ADVOCACIA</text>
  <!-- Valor à direita -->
  <text x="1120" y="300" text-anchor="end" font-family="Georgia, serif" font-size="20" fill="#B87551" opacity="0.8">A partir de</text>
  <text x="1120" y="360" text-anchor="end" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#D9A57C">R$ 497</text>
  <text x="1120" y="400" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#F7F1E8" opacity="0.5">+ R$ 500 após a vaga</text>
</svg>
